<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f6f7fb;padding:32px 16px;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:18px;padding:34px 22px;box-shadow:0 10px 30px rgba(0,0,0,0.08);">

    <div style="text-align:center;margin-bottom:28px;">
      <img
        src="https://uat.useattune.co/attune-email-logo-v2.png"
        width="64"
        height="64"
        alt="Attune"
        style="display:block;margin:0 auto;width:64px;height:64px;border:0;border-radius:18px;"
      />
    </div>

    <h2 style="margin:0 0 12px 0;font-weight:700;font-size:24px;line-height:1.2;color:#1f2937;text-align:center;">
      Your Attune code
    </h2>

    <p style="margin:0 auto 16px auto;font-size:15px;color:#6b7280;line-height:1.6;text-align:center;max-width:320px;">
      Enter this code in Attune to continue.
    </p>

    <p style="margin:0 auto 26px auto;font-size:14px;color:#6b7280;line-height:1.6;text-align:center;max-width:330px;">
      You're one step away from getting back into your day.
    </p>

    <div style="margin:28px auto;text-align:center;">
      <div style="display:block;width:100%;box-sizing:border-box;padding:16px 12px;border-radius:14px;background:#f3f4f6;border:1px solid #e5e7eb;">
        <span style="display:block;text-align:center;font-family:SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:32px;line-height:1;font-weight:800;letter-spacing:0.22em;text-indent:0.22em;color:#111827;white-space:nowrap;">
          {{ .Token }}
        </span>
      </div>
    </div>

    <p style="margin:0 0 20px 0;font-size:14px;color:#6b7280;line-height:1.6;text-align:center;">
      This code is one-time use.
    </p>

    <p style="margin:0 0 24px 0;font-size:13px;color:#9ca3af;line-height:1.6;text-align:center;">
      If you didn't request this email, you can safely ignore it.
    </p>

    <hr style="border:none;border-top:1px solid #f0f0f0;margin:28px 0;" />

    <p style="font-size:12px;color:#9ca3af;text-align:center;line-height:1.5;margin:0;">
      Attune &bull; Meet yourself where you are, then take one small step forward.
    </p>
  </div>
</div>
